[project]
name = "cendekiara"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "typer>=0.12", "jinja2>=3.1", "markdown-it-py>=3",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "httpx>=0.27"]
gcp = ["firebase-admin>=6.5", "google-cloud-firestore>=2.16", "google-cloud-tasks>=2.16"]

[project.scripts]
cendekiara = "cendekiara.cli:app"

[tool.setuptools.dynamic]
version = { attr = "cendekiara.__version__" }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cendekiara*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
